server:
  port: 7020
  servlet.context-path: /workspace

spring:
  datasource:
    url: jdbc:postgresql://localhost:1032/vintrix-workspace-db?TimeZone=Asia/Kolkata
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
minio:
  url: http://localhost:1001
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: project1


---
spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.vintrix-core.svc.clustor.local:5432/workspace-db
    username: workspace_user
    password: ${DB_PASSWORD}

  data:
    redis:
      host: redis.vintrix-core.svc.clustor.local
      port: 6379

minio:
  url: http://minio.vintrix-core.svc.clustor.local:1001
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  project-bucket: project1